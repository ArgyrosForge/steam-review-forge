name: Deploy Steam Review Forge

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish
        run: >
          dotnet publish
          src/SteamReviewForge/SteamReviewForge.csproj
          -c Release
          -o publish

      - name: Configure GitHub Pages base path
        run: |
          sed -i 's|<base href="/" />|<base href="/steam-review-forge/" />|' publish/wwwroot/index.html
          touch publish/wwwroot/.nojekyll
          cp publish/wwwroot/index.html publish/wwwroot/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: publish/wwwroot

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
