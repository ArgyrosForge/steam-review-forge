<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SteamReviewForge</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <script src="js/theme-manager.js"></script>
    <script src="js/table-drag-manager.js"></script>
    <script src="js/validation-navigator.js"></script>
    <script>
        window.clipboardManager = {
            copyText: async function (text) {
                if (!navigator.clipboard) {
                    throw new Error("Clipboard API is unavailable.");
                }

                await navigator.clipboard.writeText(text);
            }
        };
    </script>
    <script>
        window.reviewDraftStorage = {
            get: function (key) {
                return localStorage.getItem(key);
            },

            set: function (key, value) {
                localStorage.setItem(key, value);
            },

            remove: function (key) {
                localStorage.removeItem(key);
            }
        };
    </script>
    <link rel="stylesheet" href="css/themes/main-blue.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link href="SteamReviewForge.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
